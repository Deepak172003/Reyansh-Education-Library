<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Reyansha Library</title>
    <script>
      // Single-Page-App fallback for GitHub Pages.
      // GitHub Pages has no server-side rewrites, so a direct visit or a
      // refresh on a route like /Reyansh-Education-Library/facilities
      // returns this 404 page instead of index.html. This script encodes
      // the intended path into a query string and redirects to the site
      // root, where a matching script in index.html decodes it and hands
      // the real path back to React Router before it mounts.
      var pathSegmentsToKeep = 1; // "Reyansh-Education-Library" — keep this in sync if the repo is ever renamed
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
